<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etiquetas y estilos de Tailwind</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6fc;
  color: #24243c;
}

header {
  background: linear-gradient(120deg, #25145d, #6942c6);
  padding: 55px 25px;
  text-align: center;
  color: white;
}

header h1 {
  font-size: 38px;
  margin: 0;
}

main {
  max-width: 1250px;
  margin: auto;
  padding: 25px;
}

nav {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 20;
  background: #f5f6fc;
  padding: 15px 0;
}

input, select {
  padding: 13px;
  border: 1px solid #d8d6eb;
  border-radius: 10px;
  font-size: 15px;
  flex: 1;
  min-width: 180px;
}

input:focus, select:focus {
  outline: 2px solid #a78bfa;
}

section {
  margin: 35px 0;
}

section h2 {
  color: #392176;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(250px, 1fr));
  gap: 17px;
}

.card {
  background: white;
  border: 1px solid #e5e2f0;
  border-radius: 16px;
  padding: 17px;
  box-shadow: 0 5px 18px #27204a0a;
  transition: 0.25s;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px #27204a20;
}

.card h3 {
  font-size: 15px;
  margin: 0 0 14px;
  overflow-wrap: anywhere;
}

.stage {
  height: 145px;
  background: linear-gradient(130deg, #f1edff, #eaf5ff);
  border: 1px solid #e5e2fa;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Cuadros de texto de color rosa */

.stage.texto {
  background: #fbcfe8;
  border: 2px solid #f472b6;
}

.stage.texto .sample {
  background: #fff0f6;
  color: #831843;
  border: 1px solid #f9a8d4;
}

.sample {
  padding: 15px 19px;
  background: #7955d8;
  color: white;
  border-radius: 8px;
  font-weight: 500;
  text-align: center;
  max-width: 90%;
  transition: 0.5s;
  overflow-wrap: anywhere;
}

.card small {
  display: block;
  margin-top: 12px;
  color: #7b7890;
}

.mini {
  display: flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  width: 85%;
  height: 85%;
}

.mini i {
  width: 37px;
  height: 37px;
  background: #7955d8;
  border-radius: 5px;
}

.hoverdemo:hover {
  transform: scale(1.2) rotate(8deg);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes bounce {
  50% { transform: translateY(-20px); }
}

@keyframes pulse {
  50% { opacity: 0.25; }
}

@keyframes ping {
  80% {
    transform: scale(1.5);
    opacity: 0.1;
  }
}

@keyframes wiggle {
  25% { transform: rotate(10deg); }
  75% { transform: rotate(-10deg); }
}

@keyframes zoom {
  50% { transform: scale(1.25); }
}

@keyframes slide {
  50% { transform: translateY(-20px); }
}

@keyframes fade {
  50% { opacity: 0.1; }
}

@keyframes flip {
  50% { transform: rotateY(180deg); }
}

footer {
  text-align: center;
  padding: 25px;
  background: #24184c;
  color: white;
}

@media(max-width: 600px) {
  header h1 { font-size: 28px; }
  main { padding: 15px; }
  nav { position: static; }
}
</style>
</head>

<body>

<header>
  <h1>Etiquetas y estilos de Tailwind</h1>
</header>

<main>

  <nav>
    <input
      type="text"
      id="buscar"
      placeholder="Buscar una etiqueta..."
    >

    <select id="categoria">
      <option value="">Todas las categorías</option>
    </select>
  </nav>

</main>

<footer>

Object.entries(grupos).forEach(([grupo, texto]) => {
  texto.trim().split(/\s+/).forEach(clase => {
    ejemplos.push({ grupo, clase });
  });
});

// Nombre descriptivo para los textos

  return nombres[clase] || "Ejemplo de " + clase;
}

// Aplicar los estilos visuales

function estilo(clase) {

  const estilos = {

    "select-text": "user-select:text",

    "invisible": "visibility:hidden",
    "hidden": "display:none"

  if (estilos[clase]) {
    return estilos[clase];
  }

  if (clase.startsWith("animate-")) {

    if (clase === "animate-none") {
      return "animation:none";
    }

    let animacion = "bounce";

    if (/spin|rotate/.test(clase)) {
      animacion = "spin";
    } else if (/ping/.test(clase)) {
      animacion = "ping";
    } else if (/pulse|blink/.test(clase)) {
      animacion = "pulse";
    } else if (/wiggle|shake|jello|tada/.test(clase)) {
      animacion = "wiggle";
    } else if (/zoom|scale|heartbeat/.test(clase)) {
      animacion = "zoom";
    } else if (/slide/.test(clase)) {
      animacion = "slide";
    } else if (/fade/.test(clase)) {
      animacion = "fade";
    } else if (/flip/.test(clase)) {
      animacion = "flip";
    }

    return `animation:${animacion} 1.6s ease-in-out infinite`;
  }

  if (clase.startsWith("border-")) {
    return "border:4px solid #4338ca";
  }

  if (clase.startsWith("rounded-")) {
    return "border-radius:24px";
  }

  if (clase.startsWith("shadow-")) {
    return "box-shadow:0 14px 25px #0005";
  }

  if (clase.startsWith("opacity-")) {
    return "opacity:.5";
  }

  if (clase.startsWith("tracking-")) {
    return "letter-spacing:4px";
  }

  if (clase.startsWith("leading-")) {
    return "line-height:2.5";
  }

  if (clase.startsWith("backdrop-")) {
    return "backdrop-filter:blur(8px);background:#7955d899";
  }

  if (clase.startsWith("hover:")) {
    return "cursor:pointer";
  }

  if (/^(m-|mt-|mb-|ml-|mr-|mx-)/.test(clase)) {
    return "margin:20px";
  }

  if (/^(p-|pt-|pb-|pl-|pr-|px-|py-)/.test(clase)) {
    return "padding:25px";
  }

  return "";
}

// Generar el ejemplo visual

function demostracion(clase, grupo) {

  const caja = (css = "", texto = "Ejemplo visual") =>
    `<div class="sample" style="${css}">${texto}</div>`;

  // Ejemplos de texto con nombres descriptivos

  if (grupo === "Texto y tipografía") {

    let css = estilo(clase);

    if (clase === "truncate") {
      css += ";width:160px;overflow:hidden;" +
             "white-space:nowrap;text-overflow:ellipsis";
    }

    if (clase === "whitespace-nowrap") {
      css += ";white-space:nowrap;font-size:12px";
    }

    if (clase === "whitespace-pre-wrap") {
      css += ";white-space:pre-wrap";
    }

    return caja(css, nombreTexto(clase));
  }

  // Ejemplos de Grid

  if (grupo === "Grid") {

    let columnas = 3;

    if (clase.includes("cols-4")) columnas = 4;
    if (clase.includes("cols-5")) columnas = 5;
    if (clase.includes("cols-6")) columnas = 6;
    if (clase.includes("cols-2")) columnas = 2;
    if (clase.includes("cols-1")) columnas = 1;

    return `
      <div style="
        display:grid;
        grid-template-columns:repeat(${columnas},1fr);
        gap:7px;
        width:85%;
      ">
        ${Array.from({length:6},(_,i)=>
          `<div style="
            background:#7955d8;
            color:white;
            padding:12px 5px;
            text-align:center;
            border-radius:5px;
          ">${i+1}</div>`
        ).join("")}
      </div>
    `;
  }

  // Ejemplos de Flexbox

  if (grupo === "Flexbox") {

    let css = `
      display:flex;
      gap:7px;
      width:85%;
      height:85%;
      align-items:center;
      justify-content:center;
    `;

    if (clase === "flex-col") {
      css += "flex-direction:column;";
    }

    if (clase === "flex-row-reverse") {
      css += "flex-direction:row-reverse;";
    }

    if (clase === "justify-between") {
      css += "justify-content:space-between;";
    }

    if (clase === "justify-around") {
      css += "justify-content:space-around;";
    }

    if (clase === "items-end") {
      css += "align-items:flex-end;";
    }

    if (clase === "gap-8") {
      css += "gap:30px;";
    }

    return `
      <div style="${css}">
        <div class="sample">1</div>
        <div class="sample">2</div>
        <div class="sample">3</div>
      </div>
    `;
  }

  // Ejemplos hover

  if (clase.startsWith("hover:")) {
    return `
      <div class="sample hoverdemo">
        Pasa el cursor
      </div>
    `;
  }

  // Ejemplos de transiciones

  if (/^(transition|duration|delay|ease)/.test(clase)) {
    return `
      <div class="sample"
        style="animation:zoom 2s ease-in-out infinite">
        Transición
      </div>
    `;
  }

  // Ejemplos de scroll

  if (
    clase.includes("scroll") ||
    clase.includes("overflow") ||
    clase.includes("overscroll")
  ) {
    return `
      <div style="
        width:80%;
        height:85px;
        overflow:auto;
        background:white;
        padding:12px;
        border-radius:9px;
      ">
        Desplaza este cuadro.
        Este ejemplo permite observar el comportamiento
        del contenido cuando supera el espacio disponible.
        Continúa desplazándote para ver el resultado.
      </div>
    `;
  }

  // Ejemplos de posición

  if (
    grupo === "Posición y visibilidad" &&
    clase !== "hidden" &&
    clase !== "invisible"
  ) {
    return `
      <div style="
        position:relative;
        width:85%;
        height:95px;
        border:2px dashed #a78bfa;
        border-radius:10px;
      ">
        <div class="sample" style="
          position:absolute;
          top:10px;
          right:10px;
        ">
          Posición
        </div>
      </div>
    `;
  }

  // Ejemplos ocultos

  if (clase === "hidden" || clase === "invisible") {
    return `
      <div style="
        border:2px dashed #a78bfa;
        padding:20px;
        border-radius:10px;
        text-align:center;
      ">
        Elemento oculto
      </div>
    `;
  }

  // Ejemplos de colores

  if (
    clase.startsWith("bg-") ||
    clase.startsWith("from-") ||
    clase.startsWith("to-")
  ) {
    return caja(estilo(clase), "Color de fondo");
  }

  // Otros ejemplos

  return caja(estilo(clase));
}

// Crear las categorías del selector

const selector = document.getElementById("categoria");

Object.keys(grupos).forEach(grupo => {

  const opcion = document.createElement("option");

  opcion.value = grupo;
  opcion.textContent = grupo;

  selector.appendChild(opcion);

});

// Mostrar las tarjetas

function mostrar() {

  const busqueda = document.getElementById("buscar")
    .value.toLowerCase().trim();

  const categoria = selector.value;

  const contenido = document.getElementById("contenido");

  contenido.innerHTML = "";

  let cantidad = 0;

  Object.keys(grupos).forEach(grupo => {

    if (categoria && categoria !== grupo) {
      return;
    }

    const encontrados = ejemplos.filter(e =>
      e.grupo === grupo &&
      e.clase.toLowerCase().includes(busqueda)
    );

    if (!encontrados.length) {
      return;
    }

    cantidad += encontrados.length;

    const seccion = document.createElement("section");

    const titulo = document.createElement("h2");
    titulo.textContent = grupo;

    const cuadricula = document.createElement("div");
    cuadricula.className = "grid";

    encontrados.forEach(ejemplo => {

      const tarjeta = document.createElement("article");
      tarjeta.className = "card";

      const nombre = document.createElement("h3");
      nombre.textContent = ejemplo.clase;

      const escenario = document.createElement("div");
      escenario.className = "stage";

      // Aplicar cuadros rosa a los textos

      if (grupo === "Texto y tipografía") {
        escenario.classList.add("texto");
      }

      escenario.innerHTML = demostracion(
        ejemplo.clase,
        grupo
      );

      const descripcion = document.createElement("small");
      descripcion.textContent = grupo;

      tarjeta.append(
        nombre,
        escenario,
        descripcion
      );

      cuadricula.appendChild(tarjeta);

    });

    seccion.append(
      titulo,
      cuadricula
    );

    contenido.appendChild(seccion);

  });

  document.getElementById("contador").textContent =
    cantidad + " ejemplos disponibles";

  if (cantidad === 0) {
    contenido.innerHTML =
      "<p>No se encontraron ejemplos.</p>";
  }

}

// Activar el buscador

document.getElementById("buscar")
  .addEventListener("input", mostrar);

// Activar el filtro por categorías

selector.addEventListener("change", mostrar);

// Mostrar los ejemplos al abrir la página

mostrar();

</script>
